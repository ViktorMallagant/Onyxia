name: Deploy Onyxia Lorebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare high-definition atlas
        run: |
          python -m pip install --quiet 'Pillow>=10,<13'
          python tools/build_atlas.py

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js lore-data.js .nojekyll _site/
          cp -R assets _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
