name: Deploy Onyxia Lorebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate script syntax and Bestiary data
        run: |
          node --check app.js
          node --check lorebook.js
          node --check treatise.js
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("lore-pages-data.json").read_text(encoding="utf-8"))
          entries = data["bestiary"]["entries"]
          assert len(entries) == 16
          assert sum(e["filters"]["temperament"] == "Docile" for e in entries) == 8
          assert all(any(b.get("label") == "Classification" for b in e["blocks"]) for e in entries)
          assert len(next(e for e in entries if e["id"] == "moonkins")["images"]) == 2
          magic = data["magic"]["entries"]
          assert len(magic) == 8
          magic_images = [img for e in magic for img in e["images"]]
          assert len(magic_images) == len(set(magic_images)) == 8
          assert all(Path(img).is_file() for img in magic_images), "Missing magic card artwork"
          religions = data["religions"]["entries"]
          assert len(religions) == 4
          religion_images = [img for e in religions for img in e["images"]]
          assert len(religion_images) == len(set(religion_images)) == 4
          assert all(Path(img.split("?", 1)[0]).is_file() for img in religion_images), "Missing religion card artwork"
          print("Bestiary taxonomy, magic and religion artwork, and script syntax verified.")
          PY

      - name: Prepare high-definition atlas
        run: |
          python -m pip install --quiet 'Pillow>=10,<13'
          python tools/build_atlas.py
          python tools/build_favicon.py

      - name: Prepare static website
        run: |
          mkdir -p _site
          # Include all chapter pages and their associated CSS, JS and lore data.
          cp ./*.html ./*.css ./*.js ./*.json .nojekyll _site/
          cp favicon.svg favicon.ico favicon.png _site/
          cp -R assets _site/
          # Fail the build rather than quietly publishing broken chapter links.
          for page in realms species bestiary magic religions organisations economics; do
            test -s "_site/${page}.html"
          done
          test -s _site/lorebook.js
          test -s _site/lorebook.css
          test -s _site/lore-pages-data.json

      - name: Stamp map URLs with generated image version
        run: python tools/stamp_atlas.py

      - name: Restore chapter illustrations
        run: |
          cat deploy/artwork/onyxia-art-*.txt | base64 --decode > /tmp/onyxia-artwork.zip
          echo "71a304549f99c10c3ce17fe3977c83f25007d07fcbfd094a92eb749288d436d9  /tmp/onyxia-artwork.zip" | sha256sum --check
          unzip -q -o /tmp/onyxia-artwork.zip -d _site
          # The archived Magic cover mistakenly duplicates the Bestiary unicorn.
          # The real wizard painting was extracted from the Magic manuscript.
          cp _site/assets/lore/magic/introduction-01.webp _site/assets/lore/covers/magic.webp
          cmp _site/assets/lore/magic/introduction-01.webp _site/assets/lore/covers/magic.webp
          test -f _site/assets/lore/covers/species.webp
          test -f _site/assets/lore/realms/qaenyth-kingdom-07.webp

      - name: Validate linked artwork
        run: python tools/verify_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify artwork on the live website
        run: |
          python - <<'PY'
          import urllib.request, time
          base = '${{ steps.deployment.outputs.page_url }}'.rstrip('/') + '/'
          paths = [
              'favicon.svg',
              'favicon.ico',
              'favicon.png',
              'assets/lore/covers/species.webp',
              'assets/lore/covers/bestiary.webp',
              'assets/lore/realms/qaenyth-kingdom-07.webp',
              'assets/lore/species/vampires-07.webp',
              'assets/lore/treatises/werewolves.webp',
              'assets/lore/magic/cards/egoic.webp',
              'assets/lore/magic/cards/evocation.webp',
              'assets/lore/magic/cards/illusion.webp',
              'assets/lore/magic/cards/musical-enchantment.webp',
              'assets/lore/magic/cards/necromancy.webp',
              'assets/lore/magic/cards/nature.webp',
              'assets/lore/magic/cards/psychic.webp',
              'assets/lore/magic/cards/transmutation.webp',
              'assets/lore/religions/cards/diov-kami.webp',
              'assets/lore/religions/cards/for-ellri.webp',
              'assets/lore/religions/cards/gozgaron.webp',
              'assets/lore/religions/cards/the-sceaphierde.webp'
          ]
          failures = []
          for path in paths:
              error = ''
              for attempt in range(7):
                  try:
                      request = urllib.request.Request(base+path+'?v=20261024', headers={'User-Agent':'Onyxia-artwork-audit','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=15) as result:
                          data = result.read()
                          if result.status == 200 and len(data) > 200:
                              print('Public image OK:',path,len(data),'bytes')
                              break
                          error = f'{result.status}, {len(data)} bytes'
                  except Exception as ex:
                      error = str(ex)
                  if attempt<6:
                      time.sleep(4)
              else:
                  failures.append(f'{path}: {error}')
          if failures:
              raise SystemExit('Live image check failed: '+'; '.join(failures))
          PY

      - name: Verify updated Sceaphierde image byte-for-byte on the live site
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import time
          import urllib.request
          path = 'assets/lore/religions/cards/the-sceaphierde.webp'
          expected = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          base = '${{ steps.deployment.outputs.page_url }}'.rstrip('/') + '/'
          url = base + path + '?v=20261101-male'
          error = 'unavailable'
          for attempt in range(7):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Onyxia-religion-artwork-check', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      downloaded = response.read()
                  actual = hashlib.sha256(downloaded).hexdigest()
                  if actual == expected:
                      print(f'Sceaphierde image verified on live site: {len(downloaded):,} bytes, SHA256 {expected[:16]}')
                      break
                  error = f'SHA mismatch: expected {expected[:16]}, received {actual[:16]}'
              except Exception as exc:
                  error = str(exc)
              if attempt < 6:
                  time.sleep(4)
          else:
              raise SystemExit('Updated Sceaphierde artwork not verified: ' + error)
          PY

      - name: Verify native atlas on the live website
        run: |
          python - <<'PY'
          import hashlib
          import io
          import time
          import urllib.request
          from pathlib import Path
          from PIL import Image
          base = '${{ steps.deployment.outputs.page_url }}'.rstrip('/') + '/'
          master = Path('assets/onyxia-8000px-master.webp')
          expected = hashlib.sha256(master.read_bytes()).hexdigest()
          url = base + 'assets/onyxia-8000px-master.webp?v=' + expected[:12]
          for attempt in range(7):
              try:
                  request = urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Onyxia-atlas-verifier'})
                  with urllib.request.urlopen(request,timeout=35) as response:
                      data = response.read()
                  actual = hashlib.sha256(data).hexdigest()
                  with Image.open(io.BytesIO(data)) as image:
                      dimensions = image.size
                  if actual == expected and dimensions == (8000,4200):
                      print(f'LIVE ATLAS VERIFIED: {dimensions[0]}x{dimensions[1]}, {len(data):,} bytes, SHA256 {actual[:12]}')
                      break
                  error = f'Unexpected image content SHA256 {actual[:12]}, dimensions {dimensions}'
              except Exception as exc:
                  error = str(exc)
              if attempt < 6:
                  time.sleep(4)
          else:
              raise SystemExit('Native atlas verification failed: '+error)
          PY
