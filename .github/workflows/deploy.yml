name: Deploy Onyxia Lorebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare high-definition atlas
        run: |
          python -m pip install --quiet 'Pillow>=10,<13'
          python tools/build_atlas.py

      - name: Prepare static website
        run: |
          mkdir -p _site
          # Include all chapter pages and their associated CSS, JS and lore data.
          cp ./*.html ./*.css ./*.js ./*.json .nojekyll _site/
          cp -R assets _site/
          # Fail the build rather than quietly publishing broken chapter links.
          for page in realms species bestiary magic religions organisations economics; do
            test -s "_site/${page}.html"
          done
          test -s _site/lorebook.js
          test -s _site/lorebook.css
          test -s _site/lore-pages-data.json

      - name: Restore chapter illustrations
        run: |
          cat deploy/artwork/onyxia-art-*.txt | base64 --decode > /tmp/onyxia-artwork.zip
          echo "71a304549f99c10c3ce17fe3977c83f25007d07fcbfd094a92eb749288d436d9  /tmp/onyxia-artwork.zip" | sha256sum --check
          unzip -q -o /tmp/onyxia-artwork.zip -d _site
          test -f _site/assets/lore/covers/species.webp
          test -f _site/assets/lore/realms/qaenyth-kingdom-07.webp

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
